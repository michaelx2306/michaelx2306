name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Extract corrected project
        run: |
          rm -rf slotsec-lab-complete
          unzip -q SlotSec-Lab-V3-WiFi-Auto-fixed.zip
          test -f slotsec-lab-complete/package.json
          test -f slotsec-lab-complete/app/_layout.tsx

      - name: Install dependencies
        working-directory: slotsec-lab-complete
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate project
        working-directory: slotsec-lab-complete
        run: npm run validate

      - name: Generate native Android project
        working-directory: slotsec-lab-complete
        run: npx expo prebuild --platform android --clean

      - name: Build installable debug APK
        working-directory: slotsec-lab-complete/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp slotsec-lab-complete/android/app/build/outputs/apk/debug/app-debug.apk SlotSec-Lab.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlotSec-Lab-APK
          path: SlotSec-Lab.apk
          if-no-files-found: error
          retention-days: 30
